<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark rounded background tile -->
  <rect width="64" height="64" rx="16" fill="#080B12" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#neonGrad)" stroke-width="2" stroke-opacity="0.8" />

  <!-- Book Left Page -->
  <path 
    d="M 13 16 H 26 C 29.5 16 32 18.5 32 22 V 48 C 29 45 25.5 43.5 21 43.5 H 13 V 16 Z" 
    fill="url(#pageGradLeft)"
    stroke="#00F0FF" 
    stroke-width="3" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Book Right Page -->
  <path 
    d="M 51 16 H 38 C 34.5 16 32 18.5 32 22 V 48 C 35 45 38.5 43.5 43 43.5 H 51 V 16 Z" 
    fill="url(#pageGradRight)"
    stroke="#FF007A" 
    stroke-width="3" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Page details / text lines inside book -->
  <line x1="18" y1="24" x2="26" y2="24" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="18" y1="31" x2="26" y2="31" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="18" y1="37" x2="23" y2="37" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <line x1="38" y1="24" x2="46" y2="24" stroke="#FF007A" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="38" y1="31" x2="46" y2="31" stroke="#FF007A" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="41" y1="37" x2="46" y2="37" stroke="#FF007A" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Center bookmark ribbon or accent glowing bead -->
  <circle cx="32" cy="49" r="2.5" fill="#8B5CF6" filter="url(#glow)" />
</svg>
